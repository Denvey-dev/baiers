services:
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":${S3_INTERNAL_UI_PORT}" --address ":${S3_INTERNAL_PORT}"
    ports:
      - "${S3_INTERNAL_PORT}:${S3_INTERNAL_PORT}"
      - "${S3_INTERNAL_UI_PORT}:${S3_INTERNAL_UI_PORT}"
    environment:
      MINIO_ROOT_USER: ${S3_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${S3_ROOT_PASSWORD}
      MINIO_REGION: ${S3_MINIO_REGION_NAME}
      MINIO_BROWSER_REDIRECT_URL: ${S3_CONSOLE_URL}
      MINIO_SERVER_URL: "${S3_PUBLIC_DOMAIN}"
    volumes:
      - minio_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${S3_INTERNAL_PORT}/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-create-buckets:
    image: minio/mc:latest
    container_name: minio_create_buckets
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${S3_ROOT_PASSWORD}
      S3_INTERNAL_PORT: ${S3_INTERNAL_PORT}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET}
      S3_REGION: ${S3_MINIO_REGION_NAME}
    entrypoint: ["/bin/sh", "/setup/create_bucket.sh"]
    volumes:
      - ./minio/create_bucket.sh:/setup/create_bucket.sh
    networks:
      - app_network

volumes:
  minio_data:

networks:
  app_network:
    external: true