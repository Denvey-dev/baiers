services:
  elasticsearch:
    image: elasticsearch:8.11.3
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - node.name=es01
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      # Работаем в режиме одной ноды
      - discovery.type=single-node
      # Включаем для использования функций аутентификации
      - xpack.security.enabled=true
      # Отключаем SSL для HTTP API
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      # Heap Size. Xms - стартовый размер, Xmx - максимальный
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    # Системные лимиты
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    # Лимит контейнера
    mem_limit: 1g
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - app_network
    
    healthcheck:
      test: ["CMD-SHELL", "curl -u elastic:${ELASTIC_PASSWORD} --fail http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: kibana:8.11.3
    container_name: kibana_ui
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
      - TELEMETRY_ENABLED=false
    networks:
      - app_network

  elasticsearch-exporter:
    image: prometheuscommunity/elasticsearch-exporter:v1.7.0
    container_name: elasticsearch_exporter
    restart: unless-stopped
    command:
      - '--es.uri=http://elastic:${ELASTIC_PASSWORD}@elasticsearch:9200'
      - '--es.all'
      - '--es.indices'
    networks:
      - app_network
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  elastic_data:

networks:
  app_network:
    external: true