services:
  redis:
    image: redis:7.2-alpine
    container_name: redis_cache
    restart: unless-stopped
    # --requirepass: пароль
    # --appendonly yes: сохранение данных на диск, чтобы при перезапуске сервера данные не терялись
    # --maxmemory 512mb: ограничение по памяти
    # --maxmemory-policy volatile-lru: если память кончится, удаляем старые данные с таймером жизни
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD} 
      --appendonly yes 
      --maxmemory 256mb 
      --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    networks:
      - app_network
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: redis_exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://:${REDIS_PASSWORD}@redis:6379
    networks:
      - app_network
    depends_on:
      - redis

volumes:
  redis_data:

networks:
  app_network: {}